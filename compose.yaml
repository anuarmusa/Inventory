# Development stack: the app (server + built web) and PostgreSQL.
# `docker compose up -d db` runs only the database for `pnpm dev`;
# `docker compose up --build` runs everything at http://localhost:8080.
# Production settings (port 80, /srv/inventory, backups) come with the deployment tooling.
name: inventory

services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: inventory
      POSTGRES_DB: inventory
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      TZ: ${TZ:-Asia/Kuala_Lumpur}
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U inventory -d inventory"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  app:
    build: .
    environment:
      DATABASE_URL: postgres://inventory:${POSTGRES_PASSWORD}@db:5432/inventory
      TZ: ${TZ:-Asia/Kuala_Lumpur}
    ports:
      - "8080:80"
    volumes:
      - app-data:/data
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

volumes:
  db-data:
  app-data:
