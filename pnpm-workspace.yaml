packages:
  - apps/*
  - packages/*

# Hoisted node_modules (packages at node_modules/<name>) keep React Native's native build paths under
# Windows' 260-character limit; pnpm's default .pnpm/<name>@<version>_<hash>/... layout exceeds it and
# CMake/ninja fail with "build.ninja still dirty". Expo documents hoisting as the fallback for this.
nodeLinker: hoisted
